title: Emir Cem Gezer
description: "Ph.D. Candidate - IMT | NTNU"

baseurl:  #name of GitHub repository
url: https://emircem.com #custom url to be used instead of GitHub repository
email: "me@emircem.com"


highlighter: rouge
markdown: kramdown

# Pagination
paginate: 4
permalink: /blog/:year/:title/
paginate_path: /blog/page:num/

# Social media links in footer
# facebook: "#"
# twitter: ""
# instagram: ""
linkedin: "emircemgezer"
github: "incebellipipo"
scholar: "citations?user=tkd32OsAAAAJ"
scholar_name: "Emir Cem Gezer" # bolded in the publication list
work: "https://www.ntnu.edu/employees/emir.cem.gezer"
# researchgate: "#"
orcid: "0000-0002-6223-9805"
flickr: https://flickr.com/photos/emircem/


# Tracker
analytics: G-WBF9GYFBXX

#optimization -> compress.html
compress_html:
  clippings: [html,div, p, ul, td, h1, h2, h3, h4,link, meta, footer, nav, img, header, hr, br, head, style, li, ul, ol, time, main, script, title]
  comments: ["<!-- ", " -->"]
  endings: [all]
  ignore:
    envs: [local]
  blanklines: false
  profile: false
  startings: []

#collection
collections:
  projects:
    output: true
    permalink: /projects/:path/

sass:
  sass_dir: assets/css/_sass
  style: compressed

include:
  - _pages

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - scripts/
  - vendor/
  - .devcontainer/
  - .github/

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-email-protect
  - jekyll-target-blank
