name: Update publications from Google Scholar

on:
  schedule:
    - cron: "17 4 * * 1" # every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch publications
        run: python3 scripts/fetch_scholar.py

      - name: Commit changes
        run: |
          if git diff --quiet -- _data/scholar.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.json
          git commit -m "chore: update publications from Google Scholar"
          git push
